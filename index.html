<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pal Lighting — Tech Support Troubleshooter</title>
<style>
  /* ============================================================
     PAL LIGHTING SUPPORT SHELL — THEME
     ============================================================ */
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-alt: #eef1f6;
    --ink: #16202e;
    --ink-soft: #4a5568;
    --brand: #0b57d0;
    --brand-dark: #0a44a3;
    --brand-soft: #e3edfd;
    --accent: #b45309;
    --accent-soft: #fef3e2;
    --border: #d4dae3;
    --border-strong: #9aa5b4;
    --success: #166534;
    --danger: #b91c1c;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(22, 32, 46, .10), 0 4px 14px rgba(22, 32, 46, .06);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.55;
  }

  /* ============================================================
     HEADER / TOOLBAR (sticky so agents never lose the search)
     ============================================================ */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    box-shadow: var(--shadow);
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 14px 20px 12px;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -.02em;
    white-space: nowrap;
  }

  .logo-mark {
    height: 36px;
    width: auto;
    flex-shrink: 0;
    object-fit: contain;
  }

  .logo small {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .result-count {
    margin-left: auto;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* Search + dropdown row */
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1 1 320px;
    min-width: 240px;
  }

  .search-wrap .search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    pointer-events: none;
    opacity: .55;
  }

  #searchInput {
    width: 100%;
    padding: 11px 84px 11px 38px;
    font-size: 16px;
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  #searchInput:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-soft);
  }

  .kbd-hint {
    position: absolute;
    right: 44px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 7px;
    pointer-events: none;
  }

  .clear-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: var(--surface-alt);
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: none;
    line-height: 1;
  }
  .clear-btn:hover { background: var(--border); color: var(--ink); }
  .clear-btn.visible { display: block; }

  #categorySelect {
    flex: 0 1 260px;
    min-width: 200px;
    padding: 11px 14px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius);
    cursor: pointer;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  #categorySelect:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-soft);
  }

  /* Tag chip filter row */
  .chip-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
    align-items: center;
  }

  .chip-row-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-soft);
    margin-right: 2px;
  }

  .chip {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .12s;
    user-select: none;
  }

  .chip:hover {
    border-color: var(--brand);
    color: var(--brand);
    background: var(--brand-soft);
  }

  .chip.active {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }

  .chip.reset-chip {
    border-style: dashed;
    display: none;
  }
  .chip.reset-chip.visible { display: inline-block; }

  /* ============================================================
     MAIN CONTENT
     ============================================================ */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }

  .category-section { margin-bottom: 36px; }

  .category-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    padding-bottom: 10px;
    margin-bottom: 16px;
    border-bottom: 3px solid var(--brand);
  }

  .category-header h2 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -.02em;
  }

  .category-header .cat-desc {
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .category-header .cat-count {
    margin-left: auto;
    font-size: 13px;
    font-weight: 700;
    color: var(--brand);
    background: var(--brand-soft);
    padding: 3px 11px;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* Product cards */
  .product-grid {
    display: grid;
    gap: 18px;
  }

  .product-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .product-head {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 16px 20px 12px;
  }

  .product-head h3 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -.01em;
  }

  .sku-badge {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid #f0d9b5;
    padding: 3px 9px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .product-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-left: auto;
  }

  .tag-pill {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--brand-dark);
    background: var(--brand-soft);
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .product-body { padding: 0 20px 18px; }

  .product-summary {
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 14px;
    max-width: 75ch;
  }

  /* Quick-links row */
  .link-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .doc-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--brand-dark);
    background: var(--surface);
    border: 1.5px solid var(--brand);
    border-radius: 8px;
    padding: 7px 14px;
    text-decoration: none;
    transition: all .12s;
  }

  .doc-link:hover { background: var(--brand); color: #fff; }
  .doc-link:focus-visible { outline: 3px solid var(--brand-soft); }

  /* Steps list */
  .steps-block { margin-bottom: 16px; }

  .block-title {
    font-size: 12.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  ol.steps {
    counter-reset: step;
    list-style: none;
    display: grid;
    gap: 6px;
  }

  ol.steps li {
    counter-increment: step;
    position: relative;
    padding: 8px 12px 8px 44px;
    background: var(--surface-alt);
    border-radius: 8px;
    font-size: 14.5px;
  }

  ol.steps li::before {
    content: counter(step);
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--brand);
    color: #fff;
    font-size: 12.5px;
    font-weight: 800;
    display: grid;
    place-items: center;
  }

  /* Troubleshooting table */
  .table-scroll {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  table.ts-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    min-width: 560px;
  }

  table.ts-table caption {
    text-align: left;
    font-size: 12.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--ink-soft);
    padding: 0 0 8px;
    caption-side: top;
  }

  table.ts-table thead th {
    background: var(--ink);
    color: #fff;
    text-align: left;
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    padding: 10px 14px;
    white-space: nowrap;
  }

  table.ts-table tbody td {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    vertical-align: top;
  }

  table.ts-table tbody tr:nth-child(even) { background: var(--surface-alt); }
  table.ts-table tbody td:first-child { font-weight: 700; }

  .table-block { margin-bottom: 16px; }

  .table-note {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 0 0 8px;
    max-width: 80ch;
  }

  /* Note & warning boxes */
  .note-box, .warn-box {
    border-radius: 8px;
    padding: 12px 14px;
    margin: 0 0 14px;
    font-size: 14px;
  }
  .note-box { background: var(--accent-soft); border: 1px solid #ecc98f; }
  .warn-box { background: #fdecec; border: 1.5px solid var(--danger); }
  .box-label {
    display: block;
    font-size: 11.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .07em;
    margin-bottom: 4px;
  }
  .note-box .box-label { color: var(--accent); }
  .warn-box .box-label { color: var(--danger); }
  .note-box p, .warn-box p { max-width: 85ch; }

  /* Diagram / photo grid */
  .images-block { margin-top: 4px; }
  .image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  figure.diagram {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    margin: 0;
  }
  figure.diagram img {
    width: 100%;
    border-radius: 6px;
    display: block;
    cursor: zoom-in;
  }
  figure.diagram figcaption {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 6px;
    line-height: 1.4;
  }
  .img-missing {
    font-size: 12.5px;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1.5px dashed var(--border-strong);
    border-radius: 6px;
    padding: 14px 10px;
    text-align: center;
  }

  /* ============================================================
     V2 CARD SECTIONS — call-flow layout (header photo, at-a-glance,
     on-the-call flow, works-with pills)
     ============================================================ */
  .v2-head {
    align-items: flex-start;
    flex-wrap: nowrap;
  }

  .head-photo {
    flex-shrink: 0;
    width: 84px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .head-photo img {
    width: 100%;
    max-height: 110px;
    object-fit: contain;
    display: block;
  }

  .head-main { flex: 1; min-width: 0; }

  .head-title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .status-pill {
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status-active { color: var(--success); background: #e8f5ec; border: 1px solid #bfe3c8; }
  .status-legacy { color: var(--ink-soft); background: var(--surface-alt); border: 1px solid var(--border); }

  .head-blurb {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 4px 0 8px;
  }

  .head-links { margin-bottom: 0; }
  .head-links .doc-link { font-size: 12.5px; padding: 4px 10px; border-width: 1px; }

  .facts-block { margin-bottom: 16px; }
  .facts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 10px 18px;
  }
  .fact-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 1px;
  }
  .fact-value { font-size: 14px; line-height: 1.45; }

  .flow-block { margin-bottom: 16px; }
  .flow-wrap {
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .flow-wrap ol.steps { flex: 1; min-width: 0; }
  .flow-side {
    width: 230px;
    flex-shrink: 0;
    margin: 0;
  }
  .flow-detail {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-top: 3px;
  }
  .flow-branch { font-size: 13.5px; margin-top: 3px; }
  .flow-branch .b-bad { color: var(--danger); font-weight: 700; }
  .flow-branch .b-good { color: var(--success); font-weight: 700; }

  .works-block { margin-bottom: 14px; }
  .works-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .works-pill {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    border: 1px solid var(--border-strong);
    background: var(--surface);
    padding: 3px 11px;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* ============================================================
     HOME DIRECTORY TILES + DETAIL VIEW
     ============================================================ */
  .tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  .product-tile {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    text-align: left;
    font-family: inherit;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    transition: border-color .12s, transform .12s, box-shadow .12s;
  }

  .product-tile:hover,
  .product-tile:focus-visible {
    border-color: var(--brand);
    box-shadow: 0 4px 18px rgba(11, 87, 208, .18);
    transform: translateY(-2px);
    outline: none;
  }

  .tile-photo {
    height: 118px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .tile-photo img {
    max-width: 100%;
    max-height: 110px;
    object-fit: contain;
    padding: 6px;
  }

  .tile-monogram {
    width: 54px;
    height: 54px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--brand) 0%, #3b82f6 100%);
    color: #fff;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: .02em;
    display: grid;
    place-items: center;
  }

  .tile-info {
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }

  .tile-name {
    font-size: 14.5px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--ink);
  }

  .tile-sku { align-self: flex-start; margin-top: auto; }

  .detail-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--brand-dark);
    background: var(--surface);
    border: 1.5px solid var(--brand);
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
    transition: all .12s;
  }
  .back-btn:hover { background: var(--brand); color: #fff; }
  .back-btn:focus-visible { outline: 3px solid var(--brand-soft); }

  .crumb {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  /* Search-hit highlight */
  mark {
    background: #fde047;
    color: var(--ink);
    border-radius: 3px;
    padding: 0 2px;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 70px 20px;
    color: var(--ink-soft);
  }

  .empty-state .empty-icon { font-size: 44px; margin-bottom: 12px; }
  .empty-state h2 { font-size: 20px; color: var(--ink); margin-bottom: 6px; }
  .empty-state p { font-size: 15px; margin-bottom: 18px; }

  .empty-state button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    background: var(--brand);
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    cursor: pointer;
  }
  .empty-state button:hover { background: var(--brand-dark); }

  footer {
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-soft);
    padding: 20px;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 640px) {
    header { position: static; }
    .result-count { display: none; }
    .kbd-hint { display: none; }
    .product-tags { margin-left: 0; }
    .tile-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .tile-photo { height: 96px; }
    .tile-photo img { max-height: 88px; }
    .flow-wrap { flex-direction: column; }
    .flow-side { width: 100%; max-width: 320px; }
    .head-photo { width: 64px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand-row">
      <div class="logo">
        <img class="logo-mark" src="assets/PAL-Lighting.png" alt="PAL Lighting logo">
        <div>
          Pal Lighting
          <small>Tech Support Troubleshooter</small>
        </div>
      </div>
      <div class="result-count" id="resultCount" aria-live="polite"></div>
    </div>

    <div class="controls">
      <div class="search-wrap">
        <span class="search-icon">&#128269;</span>
        <input
          type="search"
          id="searchInput"
          placeholder="Search products, SKUs, symptoms, fixes&hellip;"
          autocomplete="off"
          aria-label="Search all support content">
        <span class="kbd-hint">/</span>
        <button class="clear-btn" id="clearBtn" aria-label="Clear search" title="Clear search">&times;</button>
      </div>
      <select id="categorySelect" aria-label="Filter by category"></select>
    </div>

    <div class="chip-row" id="chipRow"></div>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<footer>Pal Lighting Internal Support Tool &mdash; data-driven shell. Add products to the <code>DATA</code> array to expand.</footer>

<script>
/* ==================================================================
   DATA
   ------------------------------------------------------------------
   All content on screen is generated from this array. NO HTML here —
   plain text, links as {label, url} objects, tables as headers + rows.

   Category object shape:
   {
     id:          "cat-remotes"            (unique, kebab-case)
     category:    "Remotes"                (display name)
     description: "short blurb"            (optional)
     products: [
       {
         name:    "Product display name",
         sku:     "PL-R100",               (optional)
         hero:    "source-manuals/…/photo.png", (optional — product photo shown
                                            on its home-page tile; tiles without
                                            one show a monogram fallback)
         tags:    ["RF", "Battery"],       (optional — become chip filters)
         summary: "One-line product description.",       (optional)
         links:   [{ label: "Manual (PDF)", url: "#" }], (optional)
         steps:   ["First do…", "Then do…"],             (optional)
         table: {                                        (optional)
           caption: "Quick Troubleshooting",
           note: "Shown above the table.",               (optional)
           headers: ["Symptom", "Likely Cause", "Fix"],
           rows: [
             ["No response", "Dead batteries", "Replace with 2x AAA"]
           ]
         },
         tables:   [ {…}, {…} ],       (optional — several tables on one card;

/* ==================================================================
   RENDERING ENGINE — builds everything from DATA with DOM APIs only.
   ================================================================== */
(function () {
  "use strict";

  const app = document.getElementById("app");
  const searchInput = document.getElementById("searchInput");
  const clearBtn = document.getElementById("clearBtn");
  const categorySelect = document.getElementById("categorySelect");
  const chipRow = document.getElementById("chipRow");
  const resultCount = document.getElementById("resultCount");

  const state = {
    query: "",
    category: "all",
    activeTags: new Set(),
    /* null = home tile directory; {catId, productName} = single-product detail view */
    view: null
  };

  /* ---------- small DOM helper (no innerHTML for data content) ---------- */
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  /* Wrap search matches in <mark> safely */
  function highlighted(text, query) {
    const frag = document.createDocumentFragment();
    if (!query) {
      frag.appendChild(document.createTextNode(text));
      return frag;
    }
    const lower = text.toLowerCase();
    const q = query.toLowerCase();
    let pos = 0, hit;
    while ((hit = lower.indexOf(q, pos)) !== -1) {
      if (hit > pos) frag.appendChild(document.createTextNode(text.slice(pos, hit)));
      const mark = document.createElement("mark");
      mark.textContent = text.slice(hit, hit + q.length);
      frag.appendChild(mark);
      pos = hit + q.length;
    }
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    return frag;
  }

  /* ---------- normalize table / tables into one array ---------- */
  function productTables(product) {
    if (product.tables && product.tables.length) return product.tables;
    if (product.table) return [product.table];
    return [];
  }

  /* ---------- searchable text for a product (name, sku, tags, tables…) ---------- */
  function productHaystack(product) {
    const parts = [product.name, product.sku, product.summary, product.blurb, product.status];
    (product.tags || []).forEach(t => parts.push(t));
    (product.links || []).forEach(l => parts.push(l.label));
    (product.steps || []).forEach(s => parts.push(s));
    (product.notes || []).forEach(n => parts.push(n));
    (product.warnings || []).forEach(w => parts.push(w));
    (product.facts || []).forEach(f => { parts.push(f.label); parts.push(f.value); });
    (product.flow || []).forEach(s => { parts.push(s.text); parts.push(s.detail); parts.push(s.good); parts.push(s.bad); });
    if (product.flowImage) { parts.push(product.flowImage.caption); parts.push(product.flowImage.alt); }
    if (product.worksWith) {
      (Array.isArray(product.worksWith) ? product.worksWith : (product.worksWith.items || [])).forEach(w => parts.push(w));
    }
    (product.images || []).forEach(img => { parts.push(img.caption); parts.push(img.alt); });
    productTables(product).forEach(t => {
      parts.push(t.caption);
      parts.push(t.note);
      (t.headers || []).forEach(h => parts.push(h));
      (t.rows || []).forEach(row => row.forEach(cell => parts.push(cell)));
    });
    return parts.filter(Boolean).join(" ").toLowerCase();
  }

  /* ---------- filtering ---------- */
  function productMatches(product) {
    if (state.query && !productHaystack(product).includes(state.query)) return false;
    if (state.activeTags.size > 0) {
      const tags = product.tags || [];
      for (const wanted of state.activeTags) {
        if (!tags.includes(wanted)) return false;
      }
    }
    return true;
  }

  /* ---------- home-grid category ordering & exclusions (rendering layer only — DATA is untouched) ---------- */
  const HOME_CATEGORY_ORDER = ["cat-remotes", "cat-drivers", "cat-competitors", "cat-lights", "cat-strip"];
  const HOME_EXCLUDED_CATEGORIES = ["cat-troubleshooting", "cat-process"];

  function filteredData() {
    const isDefaultHomeView = state.category === "all" && !state.query && state.activeTags.size === 0;

    return DATA
      .filter(cat => state.category === "all" || cat.id === state.category)
      .filter(cat => !isDefaultHomeView || !HOME_EXCLUDED_CATEGORIES.includes(cat.id))
      .map(cat => ({ ...cat, products: cat.products.filter(productMatches) }))
      .filter(cat => cat.products.length > 0)
      .sort((a, b) => {
        const ai = HOME_CATEGORY_ORDER.indexOf(a.id);
        const bi = HOME_CATEGORY_ORDER.indexOf(b.id);
        if (ai === -1 && bi === -1) return 0;
        if (ai === -1) return 1;
        if (bi === -1) return -1;
        return ai - bi;
      });
  }

  /* ---------- build the category dropdown ---------- */
  function buildCategorySelect() {
    categorySelect.replaceChildren();
    const allOpt = el("option", null, "All Categories");
    allOpt.value = "all";
    categorySelect.appendChild(allOpt);
    DATA.forEach(cat => {
      const opt = el("option", null, cat.category + " (" + cat.products.length + ")");
      opt.value = cat.id;
      categorySelect.appendChild(opt);
    });
  }

  /* ---------- build the tag chip filters (union of all product tags) ---------- */
  function buildChips() {
    chipRow.replaceChildren();
    const allTags = new Set();
    DATA.forEach(cat => cat.products.forEach(p => (p.tags || []).forEach(t => allTags.add(t))));
    if (allTags.size === 0) return;

    chipRow.appendChild(el("span", "chip-row-label", "Filter:"));

    [...allTags].sort((a, b) => a.localeCompare(b)).forEach(tag => {
      const chip = el("button", "chip", tag);
      chip.type = "button";
      chip.setAttribute("aria-pressed", "false");
      chip.addEventListener("click", () => {
        state.view = null;
        if (state.activeTags.has(tag)) state.activeTags.delete(tag);
        else state.activeTags.add(tag);
        chip.classList.toggle("active");
        chip.setAttribute("aria-pressed", chip.classList.contains("active") ? "true" : "false");
        syncResetChip();
        render();
      });
      chipRow.appendChild(chip);
    });

    const reset = el("button", "chip reset-chip", "× Clear filters");
    reset.type = "button";
    reset.id = "resetChips";
    reset.addEventListener("click", () => {
      state.activeTags.clear();
      chipRow.querySelectorAll(".chip.active").forEach(c => {
        c.classList.remove("active");
        c.setAttribute("aria-pressed", "false");
      });
      syncResetChip();
      render();
    });
    chipRow.appendChild(reset);
  }

  function syncResetChip() {
    const reset = document.getElementById("resetChips");
    if (reset) reset.classList.toggle("visible", state.activeTags.size > 0);
  }

  /* ---------- product card builders ---------- */
  function buildLinks(links) {
    const row = el("div", "link-row");
    links.forEach(link => {
      const a = el("a", "doc-link");
      /* encodeURI so local paths with spaces/commas (source-manuals/…) work */
      a.href = encodeURI(link.url);
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.appendChild(document.createTextNode("\u{1F517} "));
      a.appendChild(document.createTextNode(link.label));
      row.appendChild(a);
    });
    return row;
  }

  function buildSteps(steps, query) {
    const block = el("div", "steps-block");
    block.appendChild(el("div", "block-title", "Fix Procedure"));
    const ol = el("ol", "steps");
    steps.forEach(step => {
      const li = el("li");
      li.appendChild(highlighted(step, query));
      ol.appendChild(li);
    });
    block.appendChild(ol);
    return block;
  }

  function buildTable(tableData, query) {
    const block = el("div", "table-block");
    if (tableData.note) {
      const note = el("p", "table-note");
      note.appendChild(highlighted(tableData.note, query));
      block.appendChild(note);
    }
    const scroll = el("div", "table-scroll");
    const table = el("table", "ts-table");

    if (tableData.caption) {
      const cap = el("caption", null, tableData.caption);
      table.appendChild(cap);
    }

    const thead = el("thead");
    const headRow = el("tr");
    (tableData.headers || []).forEach(h => headRow.appendChild(el("th", null, h)));
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = el("tbody");
    (tableData.rows || []).forEach(rowData => {
      const tr = el("tr");
      rowData.forEach(cellText => {
        const td = el("td");
        td.appendChild(highlighted(cellText, query));
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    scroll.appendChild(table);
    block.appendChild(scroll);
    return block;
  }

  function buildNote(text, query) {
    const box = el("div", "note-box");
    box.appendChild(el("span", "box-label", "Note"));
    const p = el("p");
    p.appendChild(highlighted(text, query));
    box.appendChild(p);
    return box;
  }

  function buildWarning(text, query) {
    const box = el("div", "warn-box");
    box.appendChild(el("span", "box-label", "⚠ Caution / Escalate"));
    const p = el("p");
    p.appendChild(highlighted(text, query));
    box.appendChild(p);
    return box;
  }

  function buildImages(images, query) {
    const block = el("div", "images-block");
    block.appendChild(el("div", "block-title", "Diagrams & Photos"));
    const grid = el("div", "image-grid");
    images.forEach(imgData => {
      const fig = el("figure", "diagram");
      const link = el("a");
      link.href = imgData.src;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      const img = document.createElement("img");
      img.src = imgData.src;
      img.alt = imgData.alt || imgData.caption || "";
      img.loading = "lazy";
      img.addEventListener("error", () => {
        link.removeAttribute("href");
        link.replaceChildren(el("div", "img-missing",
          "Image not on file (" + imgData.src + ")."));
      });
      link.appendChild(img);
      fig.appendChild(link);
      const cap = el("figcaption");
      cap.appendChild(highlighted(imgData.caption || "", query));
      fig.appendChild(cap);
      grid.appendChild(fig);
    });
    block.appendChild(grid);
    return block;
  }

  /* ---------- v2 card builders (call-flow layout) ---------- */
  function buildFacts(facts, query) {
    const block = el("div", "facts-block");
    block.appendChild(el("div", "block-title", "At a Glance"));
    const grid = el("div", "facts-grid");
    facts.forEach(f => {
      const cell = el("div", "fact");
      cell.appendChild(el("div", "fact-label", f.label));
      const val = el("div", "fact-value");
      val.appendChild(highlighted(f.value, query));
      cell.appendChild(val);
      grid.appendChild(cell);
    });
    block.appendChild(grid);
    return block;
  }

  function buildFlowFigure(imgData, query) {
    const fig = el("figure", "diagram flow-side");
    const link = el("a");
    link.href = encodeURI(imgData.src);
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    const img = document.createElement("img");
    img.src = encodeURI(imgData.src);
    img.alt = imgData.alt || imgData.caption || "";
    img.loading = "lazy";
    img.addEventListener("error", () => fig.remove());
    link.appendChild(img);
    fig.appendChild(link);
    if (imgData.caption) {
      const cap = el("figcaption");
      cap.appendChild(highlighted(imgData.caption, query));
      fig.appendChild(cap);
    }
    return fig;
  }

  function buildFlow(product, query) {
    const block = el("div", "flow-block");
    block.appendChild(el("div", "block-title", "On the Call — Start Here"));
    const wrap = el("div", "flow-wrap");

    const list = el("ol", "steps");
    product.flow.forEach(step => {
      const li = el("li");
      li.appendChild(highlighted(step.text, query));
      if (step.detail) {
        const d = el("div", "flow-detail");
        d.appendChild(highlighted(step.detail, query));
        li.appendChild(d);
      }
      if (step.bad || step.good) {
        const b = el("div", "flow-branch");
        if (step.bad) {
          b.appendChild(el("span", "b-bad", "✗ "));
          b.appendChild(highlighted(step.bad, query));
        }
        if (step.bad && step.good) b.appendChild(document.createElement("br"));
        if (step.good) {
          b.appendChild(el("span", "b-good", "✓ "));
          b.appendChild(highlighted(step.good, query));
        }
        li.appendChild(b);
      }
      list.appendChild(li);
    });
    wrap.appendChild(list);

    if (product.flowImage) wrap.appendChild(buildFlowFigure(product.flowImage, query));
    block.appendChild(wrap);
    return block;
  }

  function buildWorksWith(worksWith, query) {
    const label = Array.isArray(worksWith) ? "Works With" : (worksWith.label || "Works With");
    const items = Array.isArray(worksWith) ? worksWith : (worksWith.items || []);
    const block = el("div", "works-block");
    block.appendChild(el("div", "block-title", label));
    const pills = el("div", "works-pills");
    items.forEach(item => {
      const pill = el("span", "works-pill");
      pill.appendChild(highlighted(item, query));
      pills.appendChild(pill);
    });
    block.appendChild(pills);
    return block;
  }

  function buildProductCard(product, query) {
    const card = el("article", "product-card");
    const isV2 = !!(product.facts || product.flow || product.blurb || product.status);

    const head = el("div", "product-head" + (isV2 ? " v2-head" : ""));

    if (isV2) {
      if (product.hero) {
        const ph = el("div", "head-photo");
        const img = document.createElement("img");
        img.src = encodeURI(product.hero);
        img.alt = product.name;
        img.loading = "lazy";
        img.addEventListener("error", () => ph.remove());
        ph.appendChild(img);
        head.appendChild(ph);
      }
      const main = el("div", "head-main");
      const titleRow = el("div", "head-title-row");
      const h3 = el("h3");
      h3.appendChild(highlighted(product.name, query));
      titleRow.appendChild(h3);
      if (product.sku) titleRow.appendChild(el("span", "sku-badge", product.sku));
      if (product.status) {
        const active = /^active/i.test(product.status);
        titleRow.appendChild(el("span", "status-pill " + (active ? "status-active" : "status-legacy"), product.status));
      }
      if (product.tags && product.tags.length) {
        const tagWrap = el("div", "product-tags");
        product.tags.forEach(t => tagWrap.appendChild(el("span", "tag-pill", t)));
        titleRow.appendChild(tagWrap);
      }
      main.appendChild(titleRow);
      if (product.blurb) {
        const b = el("p", "head-blurb");
        b.appendChild(highlighted(product.blurb, query));
        main.appendChild(b);
      }
      if (product.links && product.links.length) {
        const lr = buildLinks(product.links);
        lr.classList.add("head-links");
        main.appendChild(lr);
      }
      head.appendChild(main);
    } else {
      const h3 = el("h3");
      h3.appendChild(highlighted(product.name, query));
      head.appendChild(h3);
      if (product.sku) head.appendChild(el("span", "sku-badge", product.sku));
      if (product.tags && product.tags.length) {
        const tagWrap = el("div", "product-tags");
        product.tags.forEach(t => tagWrap.appendChild(el("span", "tag-pill", t)));
        head.appendChild(tagWrap);
      }
    }
    card.appendChild(head);

    const body = el("div", "product-body");
    if (product.summary) {
      const p = el("p", "product-summary");
      p.appendChild(highlighted(product.summary, query));
      body.appendChild(p);
    }
    if (!isV2 && product.links && product.links.length) body.appendChild(buildLinks(product.links));
    if (product.facts && product.facts.length) body.appendChild(buildFacts(product.facts, query));
    (product.warnings || []).forEach(w => body.appendChild(buildWarning(w, query)));
    if (product.flow && product.flow.length) body.appendChild(buildFlow(product, query));
    if (product.steps && product.steps.length) body.appendChild(buildSteps(product.steps, query));
    productTables(product).forEach(t => body.appendChild(buildTable(t, query)));
    (product.notes || []).forEach(n => body.appendChild(buildNote(n, query)));
    if (product.worksWith) body.appendChild(buildWorksWith(product.worksWith, query));
    if (product.images && product.images.length) body.appendChild(buildImages(product.images, query));
    card.appendChild(body);

    return card;
  }

  /* ---------- home directory tiles ---------- */
  function monogramFor(product) {
    const words = product.name.split(/\s+/).filter(w => /[A-Za-z0-9]/.test(w));
    const initials = words.slice(0, 2).map(w => w.match(/[A-Za-z0-9]/)[0].toUpperCase()).join("");
    return el("div", "tile-monogram", initials || "?");
  }

  function getCandidateImagePaths(cat, product) {
    // Generate candidate file paths in source-manuals/ based on category and product
    const candidates = [];
    const categoryName = cat.category.toLowerCase().replace(/\s+/g, " ");
    const productName = product.name.toLowerCase().replace(/\s*\(.*\)\s*/g, "").trim();
    const sku = (product.sku || "").toLowerCase();

    // Category-specific path mappings
    if (categoryName.includes("water")) {
      // WaterBlade, Bubblers, WaterSphere
      if (productName.includes("blade")) {
        // WaterBlade images are in nested SKU folders - try all common variants
        const skuVariants = ["64-EFWB", "64-EFWBL", "64-EFWB-RN", "64-EFWBL-RN"];
        skuVariants.forEach(skuVar => {
          candidates.push("source-manuals/Water Features/Waterblade/" + skuVar + "/" + skuVar + ".jpg");
          candidates.push("source-manuals/Water Features/Waterblade/" + skuVar + "/" + skuVar + ".png");
        });
        // Also try top-level if they exist
        candidates.push("source-manuals/Water Features/Waterblade/waterblade.jpg");
        candidates.push("source-manuals/Water Features/Waterblade/waterblade.png");
      } else if (productName.includes("bubbler")) {
        // Bubbler image is SKU-based
        candidates.push("source-manuals/Water Features/Bubblers/64-EGB.png");
        candidates.push("source-manuals/Water Features/Bubblers/64-EGB.jpg");
        if (sku) candidates.push("source-manuals/Water Features/Bubblers/" + sku + ".png");
      } else if (productName.includes("sphere")) {
        // WaterSphere images
        candidates.push("source-manuals/Water Features/WaterSphere/WATERSPHERE.png");
        candidates.push("source-manuals/Water Features/WaterSphere/WATERSPHERE.jpg");
        if (sku) candidates.push("source-manuals/Water Features/WaterSphere/" + sku + ".png");
      }
    } else if (categoryName.includes("landscape")) {
      // Bollard, Path Way, Garden Up - images have "-black" suffix
      if (productName.includes("bollard")) {
        candidates.push("source-manuals/Landscape Lighting/Bollard Light/bollard-black.png");
        candidates.push("source-manuals/Landscape Lighting/Bollard Light/bollard.png");
      } else if (productName.includes("path") || productName.includes("pathway")) {
        candidates.push("source-manuals/Landscape Lighting/Path Way Light/pathwaylight-black.png");
        candidates.push("source-manuals/Landscape Lighting/Path Way Light/pathway-black.png");
        candidates.push("source-manuals/Landscape Lighting/Path Way Light/pathwaylight.png");
      } else if (productName.includes("garden")) {
        candidates.push("source-manuals/Landscape Lighting/Garden Up Light/gardenlight-black.png");
        candidates.push("source-manuals/Landscape Lighting/Garden Up Light/garden-black.png");
        candidates.push("source-manuals/Landscape Lighting/Garden Up Light/gardenlight.png");
      }
    } else if (categoryName.includes("wifi") || categoryName.includes("color touch")) {
      candidates.push("source-manuals/WiFi, Color Touch App, Remotes/Color Touch/");
      candidates.push("source-manuals/WiFi, Color Touch App, Remotes/WiFi Module/");
    }

    // Add generic fallback candidates for folders
    if (candidates.length > 0 && !candidates[candidates.length - 1].includes(".")) {
      const folder = candidates[candidates.length - 1];
      const extensions = ["png", "jpg", "jpeg"];
      extensions.forEach(ext => {
        candidates.push(folder + productName.replace(/\s+/g, "-") + "." + ext);
        candidates.push(folder + productName.replace(/\s+/g, "") + "." + ext);
      });
    }

    return candidates;
  }

  function loadTileImage(product, cat, photo) {
    // First try product.hero if it exists
    if (product.hero) {
      const img = document.createElement("img");
      img.src = encodeURI(product.hero);
      img.alt = "";
      img.addEventListener("error", () => loadTileImage(product, cat, photo));
      photo.appendChild(img);
      return;
    }

    // Auto-discover from source-manuals/
    const candidates = getCandidateImagePaths(cat, product);
    let attempted = 0;

    const tryNextPath = () => {
      if (attempted >= candidates.length) {
        // No image found, use monogram
        photo.appendChild(monogramFor(product));
        return;
      }

      const path = candidates[attempted];
      attempted++;

      const img = document.createElement("img");
      img.src = encodeURI(path);
      img.alt = "";
      img.addEventListener("error", tryNextPath);
      photo.appendChild(img);
    };

    tryNextPath();
  }

  function buildProductTile(cat, product, query) {
    const tile = el("button", "product-tile");
    tile.type = "button";
    tile.setAttribute("aria-label", "Open " + product.name);

    const photo = el("div", "tile-photo");
    loadTileImage(product, cat, photo);
    tile.appendChild(photo);

    const info = el("div", "tile-info");
    const nameEl = el("div", "tile-name");
    nameEl.appendChild(highlighted(product.name, query));
    info.appendChild(nameEl);
    if (product.sku) info.appendChild(el("span", "sku-badge tile-sku", product.sku));
    tile.appendChild(info);

    tile.addEventListener("click", () => openProduct(cat.id, product.name));
    return tile;
  }

  function buildCategorySection(cat, query) {
    const section = el("section", "category-section");
    section.id = cat.id;

    const header = el("div", "category-header");
    header.appendChild(el("h2", null, cat.category));
    if (cat.description) header.appendChild(el("span", "cat-desc", cat.description));
    header.appendChild(el("span", "cat-count",
      cat.products.length + (cat.products.length === 1 ? " product" : " products")));
    section.appendChild(header);

    const grid = el("div", "tile-grid");
    cat.products.forEach(p => grid.appendChild(buildProductTile(cat, p, query)));
    section.appendChild(grid);

    return section;
  }

  /* ---------- detail view navigation ---------- */
  function openProduct(catId, productName) {
    state.view = { catId: catId, productName: productName };
    render();
    window.scrollTo(0, 0);
  }

  function goHome() {
    state.view = null;
    render();
    window.scrollTo(0, 0);
  }

  function buildEmptyState() {
    const wrap = el("div", "empty-state");
    wrap.appendChild(el("div", "empty-icon", "\u{1F50E}"));
    wrap.appendChild(el("h2", null, "No matches found"));
    wrap.appendChild(el("p", null, "Try a different search term, or clear the active filters."));
    const btn = el("button", null, "Reset all filters");
    btn.type = "button";
    btn.addEventListener("click", resetAll);
    wrap.appendChild(btn);
    return wrap;
  }

  /* ---------- main render ---------- */
  function renderDetail() {
    const cat = DATA.find(c => c.id === state.view.catId);
    const product = cat && cat.products.find(p => p.name === state.view.productName);
    if (!product) { state.view = null; render(); return; }

    app.replaceChildren();

    const bar = el("div", "detail-bar");
    const back = el("button", "back-btn", "← All products");
    back.type = "button";
    back.addEventListener("click", goHome);
    bar.appendChild(back);
    bar.appendChild(el("span", "crumb", cat.category + " / " + product.name));
    app.appendChild(bar);

    app.appendChild(buildProductCard(product, state.query));

    resultCount.textContent = "Viewing: " + cat.category;
  }

  function render() {
    if (state.view) { renderDetail(); return; }

    const data = filteredData();
    app.replaceChildren();

    let total = 0;
    data.forEach(cat => {
      total += cat.products.length;
      app.appendChild(buildCategorySection(cat, state.query));
    });

    if (total === 0) app.appendChild(buildEmptyState());

    const grandTotal = DATA.reduce((sum, cat) => sum + cat.products.length, 0);
    resultCount.textContent = total === grandTotal
      ? grandTotal + " products loaded"
      : "Showing " + total + " of " + grandTotal + " products";
  }

  function resetAll() {
    state.view = null;
    state.query = "";
    state.activeTags.clear();
    state.category = "all";
    searchInput.value = "";
    categorySelect.value = "all";
    clearBtn.classList.remove("visible");
    chipRow.querySelectorAll(".chip.active").forEach(c => {
      c.classList.remove("active");
      c.setAttribute("aria-pressed", "false");
    });
    syncResetChip();
    render();
  }

  /* ---------- events ---------- */
  searchInput.addEventListener("input", () => {
    state.view = null; /* typing always returns to the filtered home grid */
    state.query = searchInput.value.trim().toLowerCase();
    clearBtn.classList.toggle("visible", state.query.length > 0);
    render();
  });

  clearBtn.addEventListener("click", () => {
    searchInput.value = "";
    state.query = "";
    clearBtn.classList.remove("visible");
    render();
    searchInput.focus();
  });

  categorySelect.addEventListener("change", () => {
    state.view = null;
    state.category = categorySelect.value;
    render();
  });

  /* Keyboard shortcuts: "/" focuses search, Escape clears it */
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
    } else if (e.key === "Escape" && document.activeElement === searchInput) {
      searchInput.value = "";
      state.query = "";
      clearBtn.classList.remove("visible");
      render();
    } else if (e.key === "Escape" && state.view) {
      goHome();
    }
  });

  /* ---------- boot ---------- */
  buildCategorySelect();
  buildChips();
  render();
})();
</script>
</body>
</html>
